server:
  port: 8080
spring:
  application:
    name: "Autenticacion"
  devtools:
    add-properties: false
  r2dbc:
    url: "r2dbc:postgresql://${adapters.r2dbc.postgresql.host}:${adapters.r2dbc.postgresql.port}/${adapters.r2dbc.postgresql.database}"
    username: "${adapters.r2dbc.postgresql.username}"
    password: "${adapters.r2dbc.postgresql.password}"
  profiles:
    include: null
adapters:
  r2dbc:
    postgresql:
      host: "${DB_HOST:localhost}"
      port: "${DB_PORT:5432}"
      database: "${DB_NAME:autenticacion}"
      schema: "${DB_SCHEMA:public}"
      username: "${DB_USER:autenticacion_user}"
      password: "${DB_PASSWORD:pass_autenticacion}"
      initial-size: "${DB_POOL_INITIAL_SIZE:5}"
      max-size: "${DB_POOL_MAX_SIZE:10}"
      max-idle-time-minutes: "${DB_POOL_MAX_IDLE:30}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
